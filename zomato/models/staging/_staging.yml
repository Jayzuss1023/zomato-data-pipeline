# dbt properties file for the staging models
# It doesn't create any tables. It holds metadata and data-quality tests for the models in zomato/models/staging/
# Each test transforms into an SQL query which will run against Snowflake
# unique and order_id fails if any order ID appears twice
# not_null fails if any row has a null value
# duplicates and missing keys are caught at the staging layer
version: 2
models:
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: restaurant_id
        tests: [not_null]
  - name: stg_order_items
    columns:
      - name: order_item_id
        tests: [unique, not_null]
  - name: stg_restaurants
    columns:
      - name: restaurant_id
        tests: [unique, not_null]
  - name: stg_users
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: stg_reviews
    columns:
      - name: review_id
        tests: [unique, not_null]
